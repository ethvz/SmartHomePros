<!DOCTYPE html>

<script>
/* launch: reopen the app used last; "?pick" (the in-app Switch app button) shows the picker */
(function () {
  var last = null; try { last = localStorage.getItem('shpc_last'); } catch (e) {}
  if (!/[?&]pick\b/.test(location.search) && (last === 'pitch' || last === 'recruit')) {
    document.documentElement.style.background = '#000';
    location.replace(last + '/index.html' + location.hash);
  }
})();
</script>
<style>
@font-face { font-family: 'Vivint Sans'; src: url(pitch/assets/fonts/VivintSans-Light.woff) format('woff'); font-weight: 300; font-display: swap; }
@font-face { font-family: 'Vivint Sans'; src: url(pitch/assets/fonts/VivintSans-Regular.woff) format('woff'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Vivint Sans'; src: url(pitch/assets/fonts/VivintSans-Medium.woff) format('woff'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'Vivint Sans'; src: url(pitch/assets/fonts/VivintSans-Bold.woff) format('woff'); font-weight: 700; font-display: swap; }
:root { --g: 5, 229, 175; --y: 223, 255, 26; --pad: clamp(16px, 3.2vmin, 40px); --gap: clamp(12px, 2.4vmin, 28px); --ease: cubic-bezier(.2, .8, .2, 1); }

.bg { position: fixed; inset: 0; pointer-events: none; background:
  radial-gradient(60vmax 50vmax at 18% 0%, rgba(var(--g), .10), transparent 70%),
  radial-gradient(60vmax 50vmax at 85% 100%, rgba(var(--y), .07), transparent 70%); }
.app { position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + var(--pad)) calc(env(safe-area-inset-right) + var(--pad)) calc(env(safe-area-inset-bottom) + var(--pad)) calc(env(safe-area-inset-left) + var(--pad)); gap: var(--gap); }

/* brand */
.brand { flex: none; display: flex; align-items: center; gap: 14px; opacity: 0; transform: translateY(-8px); animation: in .7s var(--ease) .05s forwards; }
.brand img { width: clamp(38px, 6vmin, 56px); height: clamp(38px, 6vmin, 56px); border-radius: 24%; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }

/* the two apps */
.cards { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
@media (orientation: portrait) { .cards { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } .brand .q { display: none; } }
.card { position: relative; overflow: hidden; border: 0; padding: 0; margin: 0; border-radius: clamp(22px, 3.4vmin, 34px); background: #0c0f0e; color: #fff; text-align: left; cursor: pointer; font: inherit;

.card.pitch .ph { background-image: url(pitch/assets/home2.webp); }

.card .tx { flex: 1; min-width: 0; }

.card.pitch .ey { color: rgb(var(--g)); } .card.recruit .ey { color: rgb(var(--y)); }
.card .nm { display: block; font-size: clamp(28px, 5.2vmin, 54px); font-weight: 700; letter-spacing: -.02em; line-height: 1.02; margin-top: 4px; }
.card .ln { display: block; font-size: clamp(14px, 2vmin, 19px); font-weight: 400; color: rgba(255,255,255,.72); margin-top: 6px; }
.card .go { width: clamp(44px, 6.6vmin, 60px); height: clamp(44px, 6.6vmin, 60px); border-radius: 50%; flex: none; display: grid; place-items: center; background: rgba(255,255,255,.12); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); transition: background .3s, transform .35s var(--ease); }
.card .go svg { width: 38%; height: 38%; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: stroke .3s; }
.card.pitch:hover .go, .card.pitch:focus-visible .go { background: rgb(var(--g)); } .card.recruit:hover .go, .card.recruit:focus-visible .go { background: rgb(var(--y)); }
.card:hover .go svg, .card:focus-visible .go svg { stroke: #000; }
.card .last { position: absolute; top: clamp(14px, 2.4vmin, 24px); left: clamp(14px, 2.4vmin, 24px); height: 28px; padding: 0 12px; border-radius: 14px; display: none; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; background: rgba(0,0,0,.45); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
.card .last i { width: 6px; height: 6px; border-radius: 3px; }
.card.pitch .last i { background: rgb(var(--g)); } .card.recruit .last i { background: rgb(var(--y)); }
.card.was .last { display: inline-flex; }
@media (hover: hover) { .card:hover { transform: translateY(-3px); box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 40px 70px -30px rgba(0,0,0,.95); } .card:hover .ph { transform: scale(1.08); } }
.card:active { transform: scale(.975); transition-duration: .12s; }
.card:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* open: the card grows to the whole screen, then the app loads */
.zoom { position: fixed; z-index: 10; border-radius: 30px; overflow: hidden; pointer-events: none; transition: all .5s var(--ease); background: #000; }
.zoom .ph, .zoom .sh { position: absolute; inset: 0; background-size: cover; background-position: center; }
.zoom::after { content: ''; position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .35s ease .22s; }
.zoom.full::after { opacity: 1; }
@keyframes in { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .brand, .card { animation-duration: .01s; animation-delay: 0s !important; } .zoom { transition-duration: .01s; } }

/* ---- coming to Connect: Pulse + The Playbook (smaller row under the two apps) ---- */
:root { --pk: 255, 102, 204; --or: 255, 135, 54; }
.cards { grid-template-rows: minmax(0, 1fr) minmax(0, .58fr); }
@media (orientation: portrait) { .cards { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) minmax(0, .62fr); } .cards .card.pitch, .cards .card.recruit { grid-column: 1 / -1; } }
.card:nth-child(3) { animation-delay: .39s; } .card:nth-child(4) { animation-delay: .47s; }
a.card { display: block; text-decoration: none; }
.card.mini { background: #0b0b0d; }
.card.mini .art { position: absolute; inset: 0; overflow: hidden; }
.card.mini .art svg { position: absolute; right: -2%; top: 6%; width: 74%; height: 70%; }
.card.pulse .art { background: radial-gradient(70% 90% at 85% 20%, rgba(var(--pk), .22), transparent 70%); }
.card.book .art  { background: radial-gradient(70% 90% at 85% 20%, rgba(var(--or), .20), transparent 70%); }
.card.mini .sh { background: linear-gradient(90deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,0) 100%); }
.card.mini .bd { padding: clamp(16px, 2.6vmin, 28px); }
.card.mini .ic { width: clamp(40px, 6vmin, 58px); height: clamp(40px, 6vmin, 58px); display: grid; place-items: center; }
.card.mini .ic svg { width: 54%; height: 54%; fill: none; stroke: #000; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.card.pulse .ic { background: linear-gradient(135deg, #ff8fdc, rgb(var(--pk)) 55%, #c34697); }
.card.book .ic  { background: linear-gradient(135deg, #ffad6e, rgb(var(--or)) 55%, #e6743e); }
.card.mini .nm { font-size: clamp(22px, 3.6vmin, 38px); }
.card.mini .ln { font-size: clamp(13px, 1.7vmin, 16px); }
.card.pulse .ey { color: rgb(var(--pk)); } .card.book .ey { color: rgb(var(--or)); }
.card.pulse:hover .go, .card.pulse:focus-visible .go { background: rgb(var(--pk)); }
.card .tag { position: absolute; top: clamp(12px, 2vmin, 20px); right: clamp(12px, 2vmin, 20px); height: 26px; padding: 0 11px; border-radius: 13px; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; letter-spacing: .04em; background: rgba(0,0,0,.45); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); color: rgba(255,255,255,.85); }
.card.book .tag i { width: 6px; height: 6px; border-radius: 3px; background: rgb(var(--or)); animation: blink 1.6s ease-in-out infinite; }
.card.book .go { background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.card.book .go svg { stroke: rgba(255,255,255,.45); }
.card.book.nope { animation: nope .45s var(--ease); }
/* pulse line draws itself, then keeps breathing */
.pl-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s var(--ease) .6s forwards; }
.pl-dot { opacity: 0; animation: dot 2.2s ease-in-out 2s infinite; }
.pb-route { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s var(--ease) .8s forwards; }
.pb-route.r2 { animation-delay: 1.15s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes dot { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
@keyframes blink { 50% { opacity: .3; } }
@keyframes nope { 0%, 100% { translate: 0; } 20% { translate: -7px; } 40% { translate: 6px; } 60% { translate: -4px; } 80% { translate: 2px; } }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 28px); translate: -50% 20px; opacity: 0; z-index: 20; padding: 12px 18px; border-radius: 16px; font-size: 15px; background: rgba(28,28,30,.82); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); transition: opacity .3s, translate .4s var(--ease); pointer-events: none; }
.toast.on { opacity: 1; translate: -50% 0; }
@media (orientation: portrait) and (max-width: 600px) {
  .cards { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) auto auto; }
  .card.mini { min-height: 92px; }
  .card.mini .ln, .card.mini .tag { display: none; }
  .card.mini .art svg { width: 60%; height: 90%; top: 5%; }
  .card.mini .nm { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { .pl-line, .pb-route { animation-duration: .01s; animation-delay: 0s; } }
</style>
</head>
<body>
<div class="bg"></div>
<main class="app">
  <header class="brand">
    <img src="icon-192.png" alt="">
    <div class="t"><small>SmartHomePros</small><b>Connect</b></div>
    <div class="q">Choose an app</div>
  </header>
  <section class="cards">
    <button class="card pitch" data-app="pitch" aria-label="Open Fast Pitch">
      <span class="ph"></span><span class="sh"></span>
      <span class="last"><i></i>Last used</span>
      <span class="bd">
        <img class="ic" src="pitch/assets/icon-192.png" alt="">
        <span class="tx"><span class="ey">Sell</span><span class="nm">Fast Pitch</span><span class="ln">Win the door. Build the package.</span></span>
        <span class="go"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
      </span>
    </button>
    <button class="card recruit" data-app="recruit" aria-label="Open Fast Recruit">
      <span class="ph"></span><span class="sh"></span>
      <span class="last"><i></i>Last used</span>
      <span class="bd">
        <img class="ic" src="recruit/icon.png" alt="">
        <span class="tx"><span class="ey">Recruit</span><span class="nm">Fast Recruit</span><span class="ln">Show them the opportunity.</span></span>
        <span class="go"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
      </span>
    </button>
    <a class="card mini pulse" href="https://pulse.vivint.com" target="_blank" rel="noopener" aria-label="Open Pulse (pulse.vivint.com)">
      <span class="art"><svg viewBox="0 0 300 120" preserveAspectRatio="none" fill="none"><path class="pl-line" pathLength="1" d="M0 92 L48 84 L78 88 L104 60 L122 74 L142 30 L160 96 L178 52 L204 64 L236 34 L268 42 L300 18" stroke="rgb(255,102,204)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 92 L48 84 L78 88 L104 60 L122 74 L142 30 L160 96 L178 52 L204 64 L236 34 L268 42 L300 18 V120 H0Z" fill="url(#plg)" opacity=".5"/><defs><linearGradient id="plg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(255,102,204)" stop-opacity=".45"/><stop offset="1" stop-color="rgb(255,102,204)" stop-opacity="0"/></linearGradient></defs><circle class="pl-dot" cx="300" cy="18" r="6" fill="rgb(255,102,204)" style="transform-origin:300px 18px"/></svg></span>
      <span class="sh"></span>
      <span class="tag">pulse.vivint.com</span>
      <span class="bd">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg></span>
        <span class="tx"><span class="ey">Track</span><span class="nm">Pulse</span><span class="ln">Your numbers, your team, the leaderboard.</span></span>
        <span class="go"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M8.5 7H17v8.5"/></svg></span>
      </span>
    </a>
    <button class="card mini book" data-soon="The Playbook" aria-label="The Playbook, coming soon">
      <span class="art"><svg viewBox="0 0 300 120" fill="none" stroke="rgb(255,135,54)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><g opacity=".9"><circle cx="70" cy="86" r="9"/><circle cx="120" cy="92" r="9"/><circle cx="170" cy="86" r="9"/><path d="M212 30l12 12m0-12l-12 12M252 64l12 12m0-12l-12 12M150 22l12 12m0-12l-12 12"/></g><path class="pb-route" pathLength="1" d="M70 76 C70 40 110 30 150 50 S 230 70 248 44" /><path class="pb-route r2" pathLength="1" d="M170 76 C190 60 210 66 236 80 L 258 92"/><path d="M242 38l7 6-9 3" class="pb-route"/></svg></span>
      <span class="sh"></span>
      <span class="tag"><i></i>Coming soon</span>
      <span class="bd">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5z"/><path d="M12 6.5v13"/></svg></span>
        <span class="tx"><span class="ey">Train</span><span class="nm">The Playbook</span><span class="ln">Every play, drill and script in one place.</span></span>
        <span class="go"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
      </span>
    </button>
  </section>
</main>
<script>
(function () {
  var last = null; try { last = localStorage.getItem('shpc_last'); } catch (e) {}
  var c = last && document.querySelector('.card[data-app="' + last + '"]'); if (c) c.classList.add('was');
  var busy = false;
  document.querySelectorAll('.card[data-soon]').forEach(function (card) {
    card.addEventListener('click', function () {
      card.classList.remove('nope'); void card.offsetWidth; card.classList.add('nope');
      var t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
      t.textContent = card.dataset.soon + ' is coming soon to Connect.'; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('on'); }, 2200);
    });
  });
  document.querySelectorAll('.card[data-app]').forEach(function (card) {
    card.addEventListener('click', function () {
      if (busy) return; busy = true;
      var app = card.dataset.app; try { localStorage.setItem('shpc_last', app); } catch (e) {}
      var r = card.getBoundingClientRect(), z = document.createElement('div'), ph = card.querySelector('.ph');
      z.className = 'zoom'; z.innerHTML = '<div class="ph"></div><div class="sh"></div>';
      z.firstChild.style.backgroundImage = getComputedStyle(ph).backgroundImage; z.firstChild.style.backgroundPosition = getComputedStyle(ph).backgroundPosition;
      z.style.left = r.left + 'px'; z.style.top = r.top + 'px'; z.style.width = r.width + 'px'; z.style.height = r.height + 'px';
      document.body.appendChild(z);
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        z.style.left = '0px'; z.style.top = '0px'; z.style.width = innerWidth + 'px'; z.style.height = innerHeight + 'px'; z.style.borderRadius = '0px'; z.classList.add('full');
      }); });
      setTimeout(function () { location.href = app + '/index.html'; }, 560);
    });
  });
  /* coming back with the browser's back button: put the picker back */
  addEventListener('pageshow', function (e) { if (e.persisted) { busy = false; document.querySelectorAll('.zoom').forEach(function (z) { z.remove(); }); } });
  if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
})();
</script>
</body>
</html>
