<style>
/* Layout: full-bleed 3D stage; floating glass controls on top (brand + mode switch), product rail at the bottom, detail card on the right (bottom sheet when narrow). Single dark look to match Fast Pitch. */
:root{
  --bg:#030404; --glass:rgba(16,22,22,.78); --glass-2:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
  --fg:#f3f5f4; --muted:#9aa6a3; --mint:#1bfba5; --vg:#05E5AF; --ink:#0b1412;
  --f-display:"Vivint Sans",-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --f-body:"Vivint Sans",-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.75,.2,1);
  color-scheme:dark;
}
@font-face{font-family:"Vivint Sans";src:url(../fonts/VivintSans-Light.woff) format("woff");font-weight:300;font-display:swap}
@font-face{font-family:"Vivint Sans";src:url(../fonts/VivintSans-Regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Vivint Sans";src:url(../fonts/VivintSans-Medium.woff) format("woff");font-weight:500 600;font-display:swap}
@font-face{font-family:"Vivint Sans";src:url(../fonts/VivintSans-Bold.woff) format("woff");font-weight:700 900;font-display:swap}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;position:fixed;inset:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}

/* top bar */
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.lead{display:flex;align-items:center;gap:14px;min-width:0}
#brand .eb{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mint)}
#brand h1{margin:4px 0 0;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
#brand p{margin:6px 0 0;font-size:14px;color:var(--muted);max-width:34ch}
#back{display:flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 12px;border-radius:24px;font-weight:600;font-size:16px}
#back svg{width:22px;height:22px}
#seg{display:flex;padding:4px;border-radius:26px;gap:2px}
#seg button{height:42px;padding:0 20px;border-radius:21px;font-weight:600;font-size:15px;color:var(--muted);transition:background .25s,color .25s}
#seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}

/* hotspots */
#spots{position:fixed;inset:0;pointer-events:none;z-index:3}
.hs{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:auto;will-change:transform}
.hs .dot{position:absolute;inset:4px;border-radius:50%;background:rgba(10,16,16,.38);border:1.5px solid rgba(255,255,255,.9);box-shadow:0 0 18px rgba(27,251,165,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hs .dot::before{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.hs .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--mint);opacity:0;animation:pulse 2.4s var(--ease) infinite}
.hs .lbl{position:absolute;top:50%;left:44px;transform:translateY(-50%);white-space:nowrap;padding:7px 10px;border-radius:7px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;line-height:1.25;
  background:rgba(22,24,24,.82);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hs.l .lbl{left:auto;right:44px}
.hs.mini{transform-origin:center}
.hs.mini .dot{inset:10px;opacity:.85}
.hs.mini .dot::after{display:none}
.hs.mini .lbl,.hs.nolbl .lbl{display:none}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}80%,100%{transform:scale(1.5);opacity:0}}

/* bottom rail */
/* product carousel: identical to Fast Pitch's All Products sheet */
#rail{position:fixed;left:0;right:0;bottom:10px;z-index:6;height:212px;pointer-events:none}
#railIn{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;gap:22px;overflow-x:auto;overflow-y:hidden;padding:0 28px 12px;scroll-padding:0 40px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;pointer-events:auto;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%)}
#railIn::-webkit-scrollbar{display:none}
#railIn .grp{flex:none;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;scroll-snap-align:start}
#railIn .grp[hidden]{display:none}
#railIn .grp>span{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:#fff;font-weight:600;padding-left:6px;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.55)}
#railIn .row{display:flex;gap:10px}
#railIn .pi{position:relative;width:112px;height:152px;flex:none;border:0;border-radius:24px;background:rgba(36,36,38,.42);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 8px 12px;gap:8px;text-align:center;font:inherit;font-size:12px;font-weight:500;line-height:1.2;color:#fff;cursor:pointer;transition:transform .2s var(--ease),background .25s,box-shadow .25s}
#railIn .pi:active{transform:scale(.96)}
#railIn .pi[aria-current="true"]{background:rgba(72,72,74,.72);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),0 8px 24px rgba(0,0,0,.22)}
#railIn .pi[hidden]{display:none}
#railIn .pi img{width:84px;height:84px;object-fit:contain;margin-bottom:auto;margin-top:12px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}

/* detail card */
#card{position:fixed;z-index:7;right:max(18px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 86px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 222px);width:min(360px,38vw);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(0);opacity:1;transition:transform .45s var(--ease),opacity .35s}
#card.away{transform:translateX(30px);opacity:0;pointer-events:none}
.c-media{position:relative;height:170px;flex:0 0 auto;display:grid;place-items:center;background:radial-gradient(70% 80% at 50% 60%,rgba(27,251,165,.14),transparent 70%)}
.c-media img{max-height:140px;max-width:78%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.c-body{padding:4px 22px 0;overflow-y:auto;flex:1 1 auto;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.c-where{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
.c-name{margin:6px 0 14px;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.08;text-wrap:balance}
.feat{padding:12px 0;border-top:1px solid var(--line)}
.feat b{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
.feat p{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.c-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line);flex:0 0 auto}
.c-nav button{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;font-weight:600;font-size:14px;background:var(--glass-2)}
.c-nav button svg{width:18px;height:18px}
.c-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#next{flex-direction:column;align-items:flex-end;gap:1px;height:auto;padding:8px 14px;background:none}
#next small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
#next b{display:flex;align-items:center;gap:4px;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase}
#prev{width:44px;padding:0;justify-content:center}

/* hint + loading */
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 222px);transform:translateX(-50%);z-index:4;padding:9px 16px;border-radius:18px;font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap;transition:opacity .5s}
#hint.gone{opacity:0}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:9;background:radial-gradient(120% 80% at 50% 42%,#0b1312 0,var(--bg) 70%);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#loading{place-content:center;gap:14px;justify-items:center}
#loading div{font-size:15px;color:var(--muted);letter-spacing:.02em}
/* the house being assembled (built by #ldJs); pieces animate on transform/opacity only */
#loading .ld-wrap{width:min(86vw,560px,72vh);transition:transform .7s var(--ease),opacity .6s}
#loading.done .ld-wrap{transform:scale(1.12);opacity:0}
#ldHouse{display:block;width:100%;height:auto;overflow:visible;animation:ldBob 3.6s ease-in-out infinite}
@keyframes ldBob{50%{transform:translateY(-4px)}}
#ldHouse polygon{stroke-linejoin:round}
.ld-ghost polygon{fill:none;stroke:rgba(5,229,175,.2);stroke-width:.7;stroke-dasharray:3 3;transition:opacity .6s}
.ld-ghost .ld-lot{fill:rgba(5,229,175,.035);stroke:rgba(5,229,175,.16);stroke-dasharray:none}
.fin .ld-ghost polygon:not(.ld-lot){opacity:0}
.ld-p{opacity:0;transform:translateY(-34px);transition:opacity .3s ease,transform .62s cubic-bezier(.3,1.45,.5,1)}
.ld-p.on{opacity:1;transform:none}
.ld-slab{transform:translateY(12px)}
.ld-win,.ld-door,.ld-prod{transform-box:fill-box;transform-origin:50% 50%;transform:scale(.3)}
.ld-roof{transform:translateY(-46px)}
.ld-t{fill:#eef2f3}.ld-f{fill:#d3d9dc}.ld-s{fill:#a7b1b5}
#ldHouse .ld-t,#ldHouse .ld-f,#ldHouse .ld-s{stroke:rgba(255,255,255,.7);stroke-width:.6}
.ld-slab .ld-t{fill:#88928f}.ld-slab .ld-f{fill:#5e6765}.ld-slab .ld-s{fill:#4a5250}
#ldHouse .ld-slab polygon{stroke:rgba(255,255,255,.18)}
#ldHouse .ld-rf{fill:#3d474a;stroke:rgba(255,255,255,.35);stroke-width:.6}
#ldHouse .ld-rb{fill:#2c3437;stroke:rgba(255,255,255,.3);stroke-width:.6}
#ldHouse .ld-g{fill:#13201e;stroke:rgba(255,255,255,.85);stroke-width:.9;transition:fill .5s}
.fin #ldHouse .ld-g{fill:#0c6b55}
#ldHouse .ld-d{fill:#27302f;stroke:rgba(255,255,255,.8);stroke-width:.8}
#ldHouse .ld-gd{fill:#e6ebed;stroke:rgba(0,0,0,.18);stroke-width:.6}
#ldHouse .ld-ln{fill:none;stroke:rgba(0,0,0,.18);stroke-width:.6}
.ld-prod{transition:opacity .2s,transform .5s cubic-bezier(.3,1.8,.5,1)}
.ld-dev{fill:#1a2120;stroke:#fff;stroke-width:.8}
.ld-led{fill:var(--vg)}
.ld-ring{fill:none;stroke:var(--vg);stroke-width:1.6;opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.ld-prod.on .ld-ring{animation:ldRing .9s ease-out .15s}
.fin .ld-prod .ld-ring{animation:ldRing 1s ease-out}
@keyframes ldRing{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
.ld-glint{fill:none;stroke:var(--vg);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22 100;stroke-dashoffset:22;opacity:0}
.fin .ld-glint{animation:ldGlint .55s cubic-bezier(.4,0,.2,1) forwards}
@keyframes ldGlint{0%{opacity:1;stroke-dashoffset:22}85%{opacity:1}100%{opacity:0;stroke-dashoffset:-100}}
#loading #loadMsg{min-height:1.3em;max-width:min(86vw,420px);padding:0 16px;box-sizing:border-box;text-align:center;line-height:1.4;transition:opacity .4s}
.fin #loadMsg,.fin #loadBar,.fail #loadBar{opacity:0}
/* paused (Fast Pitch hid the tour) or failed: everything stops; failed also dims the house and offers Try again */
#loading.paused #ldHouse,#loading.fail #ldHouse{animation-play-state:paused}
#loading.fail .ld-wrap{opacity:.3}
#ldRetry{padding:11px 22px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--fg);font:600 14px/1 var(--f-body);cursor:pointer;transition:transform 80ms var(--ease),background-color 150ms}
#ldRetry:active{transform:scale(.97);background:rgba(255,255,255,.14)}
#ldRetry[aria-busy="true"]{cursor:progress}
#loadBar{display:block;width:120px;height:2px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.1);transition:opacity .4s}
#loadBar b{display:block;height:100%;background:var(--vg);transform-origin:0 50%;transform:scaleX(0);transition:transform .12s linear}
@media (prefers-reduced-motion:reduce){ #ldHouse{animation:none} #loading.done .ld-wrap{transform:none}.ld-p,.ld-slab,.ld-roof,.ld-win,.ld-door,.ld-prod{transform:none;transition:opacity .4s} .ld-ring,.ld-glint{animation:none!important} }

/* narrow / portrait phone: card becomes a bottom sheet */
/* soft shade behind the title so it stays readable over a bright sky */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 150px);background:none;pointer-events:none;z-index:2}
body.focus::before{opacity:0}
body.focus #brand{display:none}
#brand h1,#brand p,#brand .eb{text-shadow:0 1px 12px rgba(0,0,0,.55)}
@media (max-width:760px), (max-aspect-ratio:1/1){
  #brand h1{font-size:22px}
  #brand p{display:none}
  #card{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);height:min(44vh,400px)}
  #card.away{transform:translateY(30px)}
  .c-media{height:96px}
  .c-media img{max-height:80px}
  .c-name{font-size:21px;margin-bottom:8px}
  .chip{width:80px;height:88px}
  .chip img{height:40px}
  .chip .im{height:40px;flex-basis:40px}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + clamp(196px, 30vh, 256px))}   /* above the product rail */
  body.focus #hint{display:none}
  #seg button{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){ .hs .dot::after{animation:none} #card{transition:none} }
</style>



<style id="refLook">

.hs{width:36px;height:36px;margin:-18px 0 0 -18px}

/* product card: tall panel on the left, product on a blue-grey stage, three icon features, "Next" at the foot */

#card.away{transform:translateX(-26px)}
.c-media{flex:1 1 auto;min-height:150px;height:auto;background:radial-gradient(90% 70% at 50% 42%,#3a4b5b 0%,#24313d 45%,#131a21 100%);padding:54px 20px 6px;overflow:hidden}
.c-media img{position:absolute;left:20px;right:20px;top:56px;bottom:12px;width:calc(100% - 40px);height:calc(100% - 68px);max-width:none;max-height:none;object-fit:contain;filter:drop-shadow(0 18px 26px rgba(0,0,0,.55))}
#cHead{position:absolute;left:20px;right:60px;top:18px;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;line-height:1.3;color:#fff;z-index:1}

#cX svg{width:13px;height:13px;stroke:#fff;stroke-width:2.4;stroke-linecap:round;fill:none}
.c-body{flex:0 0 auto;padding:0;overflow:visible;background:linear-gradient(180deg,#1b232b,#141618)}
.c-where,.c-name{display:none}
#cFeats{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 8px 18px}
.feat{border:0;padding:0 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px}
.feat + .feat{border-left:1px solid rgba(255,255,255,.12)}
.feat i{width:20px;height:20px;color:var(--ring)}
.feat i svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.feat b{font-size:12px;font-weight:500;line-height:1.3;margin:0;color:#e9edf1}
.feat p{display:none}
.c-nav{background:#141618;border-top:1px solid rgba(255,255,255,.08);justify-content:center;position:relative;padding:14px}
.c-count{display:none}
#prev{position:absolute;left:12px;top:50%;translate:0 -50%;background:rgba(255,255,255,.06)}
#next{align-items:center;padding:6px 14px}
#next small{font-size:10px;color:#9aa3ab}
#next b{font-size:12.5px;letter-spacing:.08em;font-weight:600}
.emb #cOpen{display:block;margin:0 auto 16px!important;height:38px!important;font-size:13.5px!important;padding:0 16px!important}

@media (max-width:760px), (max-aspect-ratio:1/1){

  if(faces){ const arr = Array(6).fill(faces.side||faces.neg); const i0 = axis==='x' ? 4 : 0; arr[i0] = faces.pos; arr[i0+1] = faces.neg; m = arr; }
  const seg = (a,b,lo,hi,mm=m,th=t,off=0) => axis==='x'
    ? slab(a,b,y0+lo,y0+hi,at-th/2+off,at+th/2+off,mm,grp)
    : slab(at-th/2+off,at+th/2+off,y0+lo,y0+hi,a,b,mm,grp);
  // split the wall into columns at every opening edge; each column is solid except where an opening covers it
  const xs = [...new Set([from, to, ...open.flatMap(o=>[o.a,o.b])])].filter(x=>x>=from&&x<=to).sort((p,q)=>p-q);
  for(let i=0;i<xs.length-1;i++){
    const x0 = xs[i], x1 = xs[i+1]; if(x1-x0 < 1e-4) continue;
    const holes = open.filter(o=>o.a<=x0+1e-6 && o.b>=x1-1e-6).map(o=>[o.lo,o.hi]).sort((p,q)=>p[0]-q[0]);
    let y = 0;
    for(const [lo,hi] of holes){ if(lo>y) seg(x0,x1,y,lo); y = Math.max(y,hi); }
    if(y<h) seg(x0,x1,y,h);
  }
  for(const o of open){
    if(o.kind==='window'){
      const fw=.06, fd=t+.06;
      seg(o.a,o.a+fw,o.lo,o.hi,M.trim,fd); seg(o.b-fw,o.b,o.lo,o.hi,M.trim,fd);
      seg(o.a,o.b,o.lo,o.lo+fw,M.trim,fd); seg(o.a,o.b,o.hi-fw,o.hi,M.trim,fd);
      if(o.mull) for(const k of o.mull){ const mx=o.a+(o.b-o.a)*k; seg(mx-.025,mx+.025,o.lo,o.hi,M.trim,fd*.7); }
      seg(o.a+fw,o.b-fw,o.lo+fw,o.hi-fw,o.lit?M.glassLit:M.glassDark,.03);
      seg(o.a-.04,o.b+.04,o.lo-.05,o.lo,M.trim,t+.12);   // sill
    }
  }
  return grp;
}

  const T = new THREE.Vector3(+(Q.get('tx')||0)*sz.x, +(Q.get('ty')||0)*sz.y, +(Q.get('tz')||0)*sz.z);   // tx/ty/tz: aim at a point offset from the centre (fractions of the product's size), for close-up crops
  controls.target.copy(T); camera.position.set(Math.sin(az)*Math.cos(el)*R, Math.sin(el)*R, Math.cos(az)*Math.cos(el)*R).add(T); camera.lookAt(T); controls.update();
  if(roll){ const r0 = roll; const o = renderer.render.bind(renderer); renderer.render = (sc, cam) => { cam.rotateZ(r0); o(sc, cam); cam.rotateZ(-r0); }; }
  if(Q.has('grid')){                                   // review sheet: six views in one image (front, 3/4 left, 3/4 right, right side, top, back)
    const V6 = [[0,0],[-40,15],[40,15],[90,0],[0,75],[180,10]].map(([a,e]) => { const c = camera.clone(), A = a*Math.PI/180, E = e*Math.PI/180;
      c.position.set(Math.sin(A)*Math.cos(E)*R, Math.sin(E)*R, Math.cos(A)*Math.cos(E)*R); c.up.set(0,1,0); c.lookAt(0,0,0); c.aspect = 1; c.near = R*.05; c.far = R*20; c.clearViewOffset(); c.updateProjectionMatrix(); return c; });
    const orig = renderer.render.bind(renderer), v2 = new THREE.Vector2();
    renderer.render = (sc, cam) => { renderer.getSize(v2); const w = Math.floor(v2.x/3), h = Math.floor(v2.y/2); renderer.setScissorTest(true);
      V6.forEach((c, i) => { const x = (i%3)*w, y = (1-Math.floor(i/3))*h; renderer.setViewport(x, y, w, h); renderer.setScissor(x+1, y+1, w-2, h-2); orig(sc, c); });
      renderer.setScissorTest(false); renderer.setViewport(0, 0, v2.x, v2.y); };
  }
  window.__studioReady = true; document.title = 'STUDIO_READY ' + sz.toArray().map(v => (v*1000).toFixed(1)).join('x');
});
