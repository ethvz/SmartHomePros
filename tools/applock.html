<style id="appLock">/* app, not a website: no text selection, callouts, image dragging or browser zoom */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y}
*,*::before,*::after{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable]:not([contenteditable="false"]),[contenteditable]:not([contenteditable="false"]) *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg,video,canvas,a{-webkit-user-drag:none;user-drag:none}</style>
<script id="appLockJs">(function(){var no=function(e){e.preventDefault()},ed=function(t){return t&&t.closest&&t.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"])')};
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,no,{passive:false})});
document.addEventListener('dragstart',function(e){if(!(e.target.closest&&e.target.closest('[draggable="true"]')))e.preventDefault()},true);
document.addEventListener('selectstart',function(e){if(!ed(e.target))e.preventDefault()},true);
document.addEventListener('contextmenu',function(e){if(!ed(e.target))e.preventDefault()},true);
addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&/^(\+|=|-|_|0)$/.test(e.key))e.preventDefault()});})();</script>
